<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Complaints</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfcfb, #e2d1c3);
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .complaint-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .complaint-card {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-left: 6px solid #f44336;
            position: relative;
        }
        .complaint-card h4 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .complaint-card p {
            margin: 6px 0;
        }
        .timestamp {
            color: #777;
            font-size: 14px;
            text-align: right;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .delete-btn:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>
    <h2>Submitted Complaints</h2>
    <div class="complaint-container">
        {% for complaint in complaints %}
        <div class="complaint-card">
            <button class="delete-btn" onclick="deleteComplaint({{ complaint[0] }})" title="Delete Complaint">×</button>
            <h4>{{ complaint[2] }} (PIN: {{ complaint[1] }})</h4>
            <p>{{ complaint[3] }}</p>
            <div class="timestamp">{{ complaint[4] }}</div>
        </div>
        {% else %}
        <p style="text-align:center;">No complaints submitted yet.</p>
        {% endfor %}
    </div>

    <script>
        function deleteComplaint(complaintId) {
            if (confirm('Are you sure you want to delete this complaint?')) {
                fetch(`/delete_complaint/${complaintId}`, {
                    method: 'DELETE',
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Error deleting complaint');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting complaint');
                });
            }
        }
    </script>
</body>
</html>
