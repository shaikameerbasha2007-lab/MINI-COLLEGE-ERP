<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Notices</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef3f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .notice-container {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 15px;
        }
        a.notice-link {
            text-decoration: none;
            color: royalblue;
            font-weight: bold;
        }
        a.notice-link:hover {
            text-decoration: underline;
        }
        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #888;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="notice-container">
        <h2>📢 Student Notices</h2>
        <ul>
            {% for file in files %}
                <li>
                    <a class="notice-link" href="{{ url_for('static', filename='notices/' + file) }}" target="_blank">{{ file }}</a>
                </li>
            {% endfor %}
        </ul>
        <a class="back" href="{{ url_for('student_portal') }}">⬅ Back to Student Dashboard</a>
    </div>
</body>
</html>
