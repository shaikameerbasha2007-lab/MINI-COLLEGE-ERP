<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Login | MBTS Govt. Polytechnic</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Oswald:700|Poppins:400,600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f9ff, #eef2f7 70%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('mbts.jpg') no-repeat center center;
            background-size: cover;
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }

        /* animated circles in background */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(33,150,243,0.08);
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }
        .circle:nth-child(1) { width: 120px; height: 120px; top: 15%; left: 10%; animation-delay: 0s; }
        .circle:nth-child(2) { width: 200px; height: 200px; bottom: 20%; right: 15%; animation-delay: 2s; }
        .circle:nth-child(3) { width: 90px; height: 90px; bottom: 10%; left: 25%; animation-delay: 4s; }

        @keyframes float {
            0%,100% { transform: translateY(0) scale(1);}
            50% { transform: translateY(-20px) scale(1.05);}
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 2rem auto;
            padding: 2.5rem 2rem;
            background: #ffffffee;
            border-radius: 24px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
            border: 1px solid #dce3f0;
            animation: fadeIn 1.2s ease-out; 
            text-align: center;
        }
        
        @keyframes fadeIn {
            0% {opacity: 0; transform: translateY(20px);}
            100% {opacity: 1; transform: translateY(0);}
        }
        
        h1 {
            font-family: 'Oswald', serif;
            color: #0d47a1;
            font-size: 2.8rem;
            margin-bottom: 1.2rem;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        h1 img {
            height: 80px;
            width: auto;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }
        
        .subtitle {
            color: #546e7a;
            font-size: 1.1rem;
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        
        /* Faculty Login Box */
        .form-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            background: #ffffff;
            padding: 2.8rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(33, 150, 243, 0.18);
            text-align: center;
            border: 1px solid #bbdefb;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .form-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(33, 150, 243, 0.22);
        }
        
        .form-box h2 {
            font-family: 'Oswald', serif;
            margin-bottom: 1.8rem;
            color: #1565c0;
            font-size: 1.9rem;
            letter-spacing: 0.5px;
            position: relative;
            padding-bottom: 12px;
        }
        
        .form-box h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #1976d2, #42a5f5);
            border-radius: 2px;
        }
        
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .input-group label {
            position: absolute;
            top: 16px;
            left: 15px;
            color: #777;
            font-size: 0.95rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .form-box input {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 1.8px solid #bbdefb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f8fdff;
        }
        
        .form-box input:focus {
            border-color: #1565c0;
            outline: none;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15);
            background: #ffffff;
        }
        
        /* floating label effect */
        .form-box input:focus + label,
        .form-box input:not(:placeholder-shown) + label {
            top: -10px;
            left: 10px;
            font-size: 0.75rem;
            background: #fff;
            padding: 0 5px;
            color: #1565c0;
        }
        
        .form-box button {
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #1976d2, #42a5f5);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            padding: 1rem 2rem;
            margin-top: 1.2rem;
            border: none;
            width: 100%;
            box-shadow: 0 6px 16px rgba(33, 150, 243, 0.3);
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        
        .form-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(21, 101, 192, 0.4);
        }
        
        /* ripple effect */
        .form-box button::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            transition: width 0.4s ease, height 0.4s ease;
        }
        .form-box button:active::after {
            width: 300px;
            height: 300px;
            transition: 0s;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 2rem 1.5rem;
                margin: 0 auto 1.5rem auto;
            }
            
            h1 {
                font-size: 2.2rem;
                flex-direction: column;
                gap: 10px;
            }
            
            h1 img {
                height: 70px;
            }
            
            .form-box {
                padding: 2rem 1.8rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .container {
                padding: 1.8rem 1.2rem;
                border-radius: 18px;
            }
            
            h1 {
                font-size: 1.9rem;
            }
            
            h1 img {
                height: 60px;
            }
            
            .form-box {
                padding: 1.8rem 1.5rem;
            }
            
            .form-box h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <!-- animated background circles -->
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <!-- College Heading with Logo -->
    <div class="container">
        <h1>
            <img src="https://uploads.onecompiler.io/438uqf3mh/43x65qxna/mbts%20logo.jpg" alt="College Logo">
            MBTS Govt. Polytechnic
        </h1>
        <p class="subtitle">Faculty Portal - Secure Access</p>
    </div>

    <!-- Faculty Login Section -->
    <div class="form-box">
        <h2>Faculty Login</h2>
        <form method="POST">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder=" " required>
                <label for="username">Username</label>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder=" " required>
                <label for="password">Faculty ID</label>
            </div>
            
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
