<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set Faculty Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
            --border-radius: 12px;
            --box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark);
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: var(--transition);
        }

        .glass-container:hover {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .form-header {
            margin-bottom: 30px;
            position: relative;
        }

        .form-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        h2 {
            color: var(--dark);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-subtitle {
            color: var(--gray);
            font-size: 14px;
            font-weight: 500;
        }

        .password-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e6e6e6;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }

        .input-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn {
            padding: 15px 20px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: var(--border-radius);
            color: white;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn i {
            font-size: 18px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.4);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: var(--border-radius);
            font-weight: 500;
            animation: fadeIn 0.5s ease;
        }

        .success {
            background: rgba(76, 201, 240, 0.1);
            color: #138496;
        }

        .error {
            background: rgba(247, 37, 133, 0.1);
            color: #dc3545;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .back-link:hover {
            color: var(--secondary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .password-requirements {
            text-align: left;
            margin-top: 10px;
            font-size: 12px;
            color: var(--gray);
            padding: 10px;
            background: rgba(67, 97, 238, 0.05);
            border-radius: var(--border-radius);
        }

        .password-requirements ul {
            padding-left: 20px;
            margin-top: 5px;
        }

        @media (max-width: 576px) {
            .glass-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="form-header">
            <div class="form-icon">
                <i class="fas fa-key"></i>
            </div>
            <h2>Set New Faculty Password</h2>
            <p class="form-subtitle">Update password for faculty access</p>
        </div>

        <form class="password-form" method="POST">
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="new_password" placeholder="New Password" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            </div>
            

            <button type="submit" class="btn">
                <i class="fas fa-save"></i>
                Save Password
            </button>
        </form>

        <!-- Flash Messages -->
        {% set messages = get_flashed_messages() %}
          {% if messages %}
            <p class="message {{ 'success' if 'success' in messages[0].toLowerCase() else 'error' }}">
                {{ messages[0] }}
            </p>
          {% endif %}

        <a href="{{ url_for('admin_dashboard') }}" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

    <script>
        // Add password strength indicator
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.querySelector('input[name="new_password"]');
            const requirements = document.querySelector('.password-requirements');
            
            passwordInput.addEventListener('focus', function() {
                requirements.style.display = 'block';
            });
            
            passwordInput.addEventListener('blur', function() {
                requirements.style.display = 'none';
            });
        });
    </script>
</body>
</html>
