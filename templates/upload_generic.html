<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* -------- CSS Variables -------- */
        :root {
            --primary: #2196F3;
            --primary-dark: #0d8bf2;
            --primary-light: rgba(33, 150, 243, 0.1);
            --secondary: #4CAF50;
            --danger: #f44336;
            --danger-dark: #d32f2f;
            --light: #f9f9f9;
            --dark: #333;
            --gray: #777;
            --white: #ffffff;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.15);
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* -------- Global Styles -------- */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #ffffff 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        h2 {
            text-align: center;
            color: var(--dark);
            font-size: 2.5rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            animation: fadeInDown 1s ease-in-out;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            padding-bottom: 15px;
        }

        h2:after {
            content: '';
            position: absolute;
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            animation: expandLine 1s ease-out;
        }

        /* -------- Form Styles -------- */
        .form-container {
            background: var(--white);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out;
            transition: var(--transition);
        }

        .form-container:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-5px);
        }

        form {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        label {
            font-weight: 600;
            color: var(--dark);
            font-size: 1.1rem;
        }

        select, input[type="file"] {
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: var(--border-radius);
            transition: var(--transition);
            outline: none;
            background: var(--white);
        }

        select:focus, input[type="file"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        .file-input-container {
            position: relative;
            margin: 10px 0;
        }

        .file-input-label {
            display: block;
            padding: 40px 20px;
            border: 2px dashed #d1d9e6;
            border-radius: var(--border-radius);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--light);
        }

        .file-input-label:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-3px);
        }

        .file-input-label i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
            transition: var(--transition);
        }

        .file-input-label:hover i {
            transform: scale(1.1);
            color: var(--secondary);
        }

        .file-input-text {
            color: var(--gray);
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .selected-files {
            margin-top: 15px;
            padding: 12px 15px;
            background: var(--primary-light);
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            animation: slideIn 0.3s ease-out;
        }

        .selected-files i {
            color: var(--primary);
        }

        button {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            cursor: pointer;
            border-radius: var(--border-radius);
            padding: 14px 24px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px auto;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            position: relative;
            overflow: hidden;
        }

        button:after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        button:active:after {
            animation: ripple 1s ease-out;
        }

        /* -------- File List Container -------- */
        .file-list {
            max-width: 100%;
            margin: 20px auto;
            background: var(--white);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            animation: fadeInUp 1s ease-in-out;
            transition: var(--transition);
        }

        .file-list:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-5px);
        }

        .file-list h3 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--dark);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .file-list h3 i {
            color: var(--primary);
        }

        /* -------- File Item Style -------- */
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            transition: var(--transition);
            animation: slideInRight 0.5s ease-out;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .file-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .file-item:hover {
            background: var(--light);
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .file-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 500;
            transition: var(--transition);
            flex: 1;
        }

        .file-link i {
            font-size: 1.2rem;
        }

        .file-link:hover {
            color: var(--primary-dark);
            transform: translateX(5px);
        }

        /* -------- Delete Button -------- */
        .delete-btn {
            background: var(--danger);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .delete-btn:hover {
            background: var(--danger-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(244, 67, 54, 0.3);
        }

        /* -------- Empty State -------- */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
            animation: fadeIn 1s ease-out;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* -------- Animations -------- */
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes fadeInUp {
            from {transform: translateY(20px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }

        @keyframes fadeInDown {
            from {transform: translateY(-20px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }

        @keyframes slideIn {
            from {transform: translateY(-10px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }

        @keyframes slideInRight {
            from {transform: translateX(20px); opacity: 0;}
            to {transform: translateX(0); opacity: 1;}
        }

        @keyframes expandLine {
            from {width: 0;}
            to {width: 100px;}
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 1;
            }
            20% {
                transform: scale(25, 25);
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(40, 40);
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(33, 150, 243, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(33, 150, 243, 0); }
            100% { box-shadow: 0 0 0 0 rgba(33, 150, 243, 0); }
        }

        /* -------- Responsive -------- */
        @media(max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            h2 {
                font-size: 2rem;
            }
            
            .form-container, .file-list {
                padding: 20px;
            }
            
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .file-link {
                width: 100%;
            }
            
            .delete-btn {
                width: 100%;
                justify-content: center;
            }
            
            .file-input-label {
                padding: 30px 15px;
            }
        }

        /* -------- Loading Spinner -------- */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-file-upload"></i> {{ title }}</h2>

        {% if not year %}
            <!-- Select Year Form -->
            <div class="form-container">
                <form method="get" action="">
                    <div class="form-group">
                        <label for="year-select"><i class="fas fa-calendar-alt"></i> Select Academic Year:</label>
                        <select name="year" id="year-select" required>
                            <option value="">-- Choose Year --</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                        </select>
                    </div>
                    <button type="submit">
                        <i class="fas fa-arrow-right"></i> Continue
                    </button>
                </form>
            </div>
        {% else %}
            <!-- Upload PDFs Form -->
            <div class="form-container">
                <form method="post" enctype="multipart/form-data" id="uploadForm">
                    <input type="hidden" name="year" value="{{ year }}">
                    
                    <div class="file-input-container">
                        <label class="file-input-label">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <div class="file-input-text">Click to select or drag and drop your files</div>
                            <div class="file-input-text">(Multiple PDF files allowed)</div>
                            <input type="file" name="pdfs" class="file-input" multiple required id="fileInput">
                        </label>
                        <div class="selected-files" id="selectedFiles">
                            <i class="fas fa-check-circle"></i>
                            <span id="fileCount">0 files selected</span>
                        </div>
                    </div>
                    
                    <button type="submit" id="uploadButton">
                        <i class="fas fa-upload"></i> Upload PDFs
                    </button>
                </form>
            </div>

            <!-- List Existing Files -->
            <div class="file-list">
                <h3><i class="fas fa-file-alt"></i> Existing Uploads (Year {{ year }})</h3>
                {% if pdf_files %}
                    {% for file in pdf_files %}
                        <div class="file-item">
                            <a href="{{ url_for('static', filename='uploads/' + ('attendance' if 'Attendance' in title else 'assignments') + '/year_' + year + '/' + file) }}" target="_blank" class="file-link">
                                <i class="fas fa-file-pdf"></i> {{ file }}
                            </a>
                            <form method="post" action="{{ url_for('delete_upload_unique', file_type=title.split()[1].lower(), year=year, filename=file) }}">
                                <button type="submit" class="delete-btn" onclick="return confirm('Are you sure you want to delete this file?');">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </form>
                        </div>
                    {% endfor %}
                {% else %}
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No files uploaded yet</h3>
                        <p>Upload your first file using the form above</p>
                    </div>
                {% endif %}
            </div>
        {% endif %}
    </div>

    <script>
        // File input functionality
        const fileInput = document.getElementById('fileInput');
        const selectedFiles = document.getElementById('selectedFiles');
        const fileCount = document.getElementById('fileCount');
        const uploadForm = document.getElementById('uploadForm');
        const uploadButton = document.getElementById('uploadButton');
        
        if (fileInput) {
            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    fileCount.textContent = `${this.files.length} file(s) selected`;
                    selectedFiles.style.display = 'flex';
                    
                    // Add success animation
                    document.querySelector('.file-input-label').style.borderColor = 'var(--secondary)';
                    document.querySelector('.file-input-label').style.animation = 'pulse 1s';
                    setTimeout(() => {
                        document.querySelector('.file-input-label').style.animation = '';
                    }, 1000);
                } else {
                    selectedFiles.style.display = 'none';
                    document.querySelector('.file-input-label').style.borderColor = '';
                }
            });
            
            // Drag and drop functionality
            const fileInputLabel = document.querySelector('.file-input-label');
            
            fileInputLabel.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
                this.style.borderColor = 'var(--primary)';
                this.style.background = 'var(--primary-light)';
            });
            
            fileInputLabel.addEventListener('dragleave', function() {
                this.classList.remove('dragover');
                this.style.borderColor = '';
                this.style.background = '';
            });
            
            fileInputLabel.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                this.style.borderColor = '';
                this.style.background = '';
                
                if (e.dataTransfer.files.length > 0) {
                    fileInput.files = e.dataTransfer.files;
                    
                    // Trigger change event to update UI
                    const event = new Event('change');
                    fileInput.dispatchEvent(event);
                }
            });
            
            // Initially hide the selected files display
            selectedFiles.style.display = 'none';
            
            // Prevent double submission
            let isSubmitting = false;
            
            uploadForm.addEventListener('submit', function(e) {
                if (isSubmitting) {
                    e.preventDefault();
                    return;
                }
                
                // Validate file is selected
                if (fileInput.files.length === 0) {
                    e.preventDefault();
                    alert('Please select at least one file to upload.');
                    return;
                }
                
                // Disable the button and set submitting flag
                isSubmitting = true;
                uploadButton.disabled = true;
                uploadButton.innerHTML = '<div class="spinner"></div> Uploading...';
                
                // Re-enable after 5 seconds in case of error (safety measure)
                setTimeout(() => {
                    isSubmitting = false;
                    uploadButton.disabled = false;
                    uploadButton.innerHTML = '<i class="fas fa-upload"></i> Upload PDFs';
                }, 5000);
            });
        }
        
        // Add animation to file items on page load
        document.addEventListener('DOMContentLoaded', function() {
            const fileItems = document.querySelectorAll('.file-item');
            fileItems.forEach((item, index) => {
                item.style.animationDelay = `${index * 0.1}s`;
            });
        });
    </script>
</body>
</html>
